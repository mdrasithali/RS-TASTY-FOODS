<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Returning to RS Tasty Foods…</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f4ea;color:#2f3a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}p{max-width:340px;line-height:1.5}button{margin-top:18px;padding:14px 24px;font-size:16px;font-weight:700;background:#28502E;color:#fff;border:0;border-radius:10px}</style>
</head>
<body>
<p id="msg">Google sign-in completed. Returning to RS Tasty Foods…</p>
<button id="returnBtn" hidden>Return to app</button>
<script>
(function(){
 const msg=document.getElementById('msg');
 const btn=document.getElementById('returnBtn');
 const raw=window.location.hash.substring(1)||window.location.search.substring(1);
 const params=new URLSearchParams(raw);
 if(!params.get('access_token')){msg.textContent='Google sign-in did not complete. You can close this page and try again.';return;}
 const target='rstastyfoods://oauth-callback.html?'+raw;
 function returnToApp(){window.location.href=target;}
 btn.hidden=false;
 btn.addEventListener('click',returnToApp);
 setTimeout(returnToApp,250);
})();
</script>
</body>
</html>
